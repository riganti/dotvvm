name: setup
description: Sets up the build environment for the DotVVM repo.

inputs:
  sln:
    default: src/DotVVM.sln
    description: Path to a Visual Studio solution
    required: false

runs:
  using: composite
  steps:

  # nuget
  - uses: nuget/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # v4.0
    with:
      nuget-version: '6.x'
  - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
    id: nuget-cache
    with:
      path: ~/.nuget/packages
      key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
      restore-keys: ${{ runner.os }}-nuget-

  # Node.js
  - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
    with:
      node-version: 24
  - run: |
      corepack enable
      yarn set version stable
    shell: bash
    
  # .NET
  - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
    with:
      dotnet-version: |
        8.0.x
        9.0.x
  - if: ${{ runner.os == 'Windows' }}
    uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

  # restore nuget packages
  - if: ${{ runner.os == 'Windows' }}
    run: msbuild "$env:SLN" -t:Restore
    shell: pwsh
    env:
      SLN: ${{ inputs.sln }}
  - if: ${{ runner.os != 'Windows' }}
    run: dotnet restore "$SLN"
    shell: bash
    env:
      SLN: ${{ inputs.sln }}

  # restore dotnet tools
  - run: dotnet tool restore
    shell: pwsh
    working-directory: src/
