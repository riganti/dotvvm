name: publish-public

on:
  workflow_dispatch:
    inputs:
      nuget-user:
        type: string
        default: "hercegtomas"
        description: NuGet.org username associated with the trusted publishing policy
        required: true
      include:
        type: string
        default: "*"
        description: RegEx describing packages to publish publicly
        required: false
      exclude:
        type: string
        default: ""
        description: RegEx describing packages to exclude from publishing publicly
        required: false
      version:
        type: string
        default: ""
        description: The version of the packages to publish publicly
        required: false
      dry-run:
        type: boolean
        default: false
        description: Run the pipeline but don't actually publish anything.

cache-mode: none

jobs:
  copy-nuget-packages:
    runs-on: windows-latest
    timeout-minutes: 10
    environment: public
    permissions:
      contents: read
      id-token: write # Required for NuGet trusted publishing.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: nuget/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # v4.0
        with:
          nuget-version: "6.x"

      - name: Log in to NuGet.org
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ inputs.nuget-user }}

      - name: Add internal NuGet feed
        run: >
          ./ci/scripts/Add-InternalNuGetFeed.ps1 `
            -internalFeed "${{ secrets.AZURE_ARTIFACTS_FEED }}" `
            -internalFeedUser "${{ secrets.AZURE_ARTIFACTS_USERNAME }}" `
            -internalFeedPat "${{ secrets.AZURE_ARTIFACTS_PAT }}" ;`
          nuget sources
        shell: pwsh

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          INCLUDE: ${{ inputs.include }}
          EXCLUDE: ${{ inputs.exclude }}
          VERSION: ${{ inputs.version }}
        run: >
          ./ci/scripts/Copy-NuGetPackages.ps1 `
            -root "${{ github.workspace }}" `
            -nuGetOrgApiKey "$env:NUGET_API_KEY" `
            -include "$env:INCLUDE" `
            -exclude "$env:EXCLUDE" `
            -version "$env:VERSION" `
            -dryRun ${{ inputs.dry-run && '$true' || '$false' }}
        shell: pwsh

  copy-npm-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Set internal npm registry
        run: |
          New-Item -ItemType Directory -Path "artifacts"
          ${{ github.workspace }}/ci/scripts/Set-NpmRegistry.ps1 `
            -targetDirectory "artifacts" `
            -registry "${{ secrets.INTERNAL_NPM_REGISTRY }}" `
            -pat "${{ secrets.INTERNAL_NPM_PAT }}" `
            -username "${{ secrets.INTERNAL_NPM_USERNAME }}" `
            -email "${{ secrets.INTERNAL_NPM_EMAIL }}"
        shell: pwsh

      - name: Copy npm packages
        env:
          INCLUDE: ${{ inputs.include }}
          EXCLUDE: ${{ inputs.exclude }}
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          $packages = @(
            "dotvvm-types"
            "dotvvm-jscomponent-react"
            "dotvvm-jscomponent-svelte"
          )

          $selectedPackages = @($packages | Where-Object {
            (($env:INCLUDE -eq '*') -or ($_ -match $env:INCLUDE)) -and
              ([string]::IsNullOrWhiteSpace($env:EXCLUDE) -or ($_ -notmatch $env:EXCLUDE))
          })

          Write-Output "Publishing packages: $selectedPackages"

          $packageTarballs = @()
          if ($selectedPackages.Count -gt 0) {
            $packageSpecs = @($selectedPackages | ForEach-Object {
              if ([string]::IsNullOrWhiteSpace($env:VERSION)) { $_ } else { "$_@$env:VERSION" }
            })
            # Download release tarballs without installing dependencies or running package scripts.
            $packageTarballs = @(npm pack @packageSpecs --ignore-scripts --silent)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          $env:NODE_AUTH_TOKEN = ""
          foreach ($tarball in $packageTarballs) {
            npm publish --verbose "./$tarball" `
                --registry https://registry.npmjs.org `
                --ignore-scripts `
                ${{ inputs.dry-run && '--dry-run' || '' }} --tag latest
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        shell: pwsh
        working-directory: ./artifacts
