name: unittest
description: Runs .NET unit tests under a specified configuration

inputs:
  project:
    default: ""
    description: The test project
    required: true
  name:
    required: true
    description: Machine-friendly name of the test project
  title:
    required: true
    description: Human-friendly name of the test project
  target-framework:
    required: false
    default: net8.0
    description: The target framework moniker used to build and run the test project
  github-token:
    description: GitHub token so that test results can be uploaded
    required: true

runs:
  using: composite
  steps:
  # build the DotVVM Compiler and CLI only when running net8.0 tests.
  # IMPORTANT: These steps must NOT run before net472 test steps (see main.yml for details).
  # --no-restore: the setup action already restored all packages for all TFMs;
  # implicit restore here would regenerate Core's NuGet targets files for net8.0 only,
  # causing the net472 build of Tests to fail with CS0518 (missing reference assemblies)
  - run: dotnet build
      src/Tools/Compiler/DotVVM.Compiler.csproj
      --framework net8.0
      --no-restore
      --configuration Debug
      -p:WarningLevel=0
    shell: bash
    if: ${{ inputs.target-framework == 'net8.0' }}
  # Also build the net472 compiler on Windows so the LintCommandLine Owin test can find
  # DotVVM.Compiler.exe via the DEBUG fallback path in CompilerCommands.cs.
  - run: dotnet build
      src/Tools/Compiler/DotVVM.Compiler.csproj
      --framework net472
      --no-restore
      --configuration Debug
      -p:WarningLevel=0
    shell: bash
    if: ${{ inputs.target-framework == 'net8.0' && runner.os == 'Windows' }}
    
  # build the DotVVM CLI (--no-restore for the same reason as above)
  - run: dotnet build
      src/Tools/CommandLine/DotVVM.CommandLine.csproj
      --framework net8.0
      --no-restore
      --configuration Debug
      -p:WarningLevel=0
    shell: bash
    if: ${{ inputs.target-framework == 'net8.0' }}
    
  # build the project separately first to get compilation errors as `dotnet test` fails silently for some reason
  - run: dotnet build
      "${{ inputs.project }}"
      --framework "${{ inputs.target-framework }}"
      --configuration Debug
      -p:WarningLevel=0
    shell: bash
  - run: dotnet build
      "${{ inputs.project }}"
      --framework "${{ inputs.target-framework }}"
      --configuration Release
      -p:WarningLevel=0
    shell: bash
  - run: dotnet test
      "${{ inputs.project }}"
      --framework "${{ inputs.target-framework }}"
      --no-restore
      --logger "GitHubActions;report-warnings=true"
      --logger "trx;LogFileName=${{ github.workspace }}/artifacts/test/unit-test-results-${{ inputs.name }}-${{ inputs.target-framework }}-Debug.trx"
      --configuration Debug
      -p:WarningLevel=0
    shell: bash
  - run: dotnet test
      "${{ inputs.project }}"
      --framework "${{ inputs.target-framework }}"
      --no-restore
      --logger "GitHubActions;report-warnings=true"
      --logger "trx;LogFileName=${{ github.workspace }}/artifacts/test/unit-test-results-${{ inputs.name }}-${{ inputs.target-framework }}-Release.trx"
      --configuration Release
      -p:WarningLevel=0
    shell: bash
  - uses: ./.github/test-report
    with:
      trx-path: artifacts/test/unit-test-results-${{ inputs.name }}-${{ inputs.target-framework }}-Debug.trx
      report-name: ${{ inputs.name }}-${{ inputs.target-framework }}-Debug-${{ runner.os }}
      report-title: ${{ inputs.title }} (${{ inputs.target-framework }}, Debug) on ${{ runner.os }}
      github-token: ${{ inputs.github-token }}
  - uses: ./.github/test-report
    with:
      trx-path: artifacts/test/unit-test-results-${{ inputs.name }}-${{ inputs.target-framework }}-Release.trx
      report-name: ${{ inputs.name }}-${{ inputs.target-framework }}-Release-${{ runner.os }}
      report-title: ${{ inputs.title }} (${{ inputs.target-framework }}, Release) on ${{ runner.os }}
      github-token: ${{ inputs.github-token }}
