name: test-report
description: |
  Writes a short test report to GitHub Actions.
  Heavily inspired by https://github.com/zyborg/dotnet-tests-report
  and https://github.com/NasAmin/trx-parser.

inputs:
  trx-path:
    required: true
    description: Path to the TRX file.
  report-name:
    required: true
    description: A filename for the report.
  report-title:
    required: true
    description: Human-friendly title of the report.
  github-token:
    required: true
    description: A GitHub token.

runs:
  using: composite
  steps:
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.report-name }}
        path: ${{ inputs.trx-path }}
    - run: Write-Host "::add-mask::$env:GITHUB_TOKEN" ;
        ./.github/test-report/test-report.ps1
          -TrxPath "$env:TRX_PATH"
          -ReportName "$env:REPORT_NAME"
          -ReportTitle "$env:REPORT_TITLE"
          -GithubToken "$env:GITHUB_TOKEN"
      shell: pwsh
      env:
        TRX_PATH: ${{ inputs.trx-path }}
        REPORT_NAME: ${{ inputs.report-name }}
        REPORT_TITLE: ${{ inputs.report-title }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
